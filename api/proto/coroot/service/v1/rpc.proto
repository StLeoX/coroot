syntax = "proto3";

package coroot.service.v1;

import "coroot/event/v1/server_span.proto";

option go_package = "github.com/coroot/coroot/api/proto/coroot/service/v1";

message EventServiceUploadRequest {
  repeated coroot.event.v1.ServerSpan spans = 1;
}

message EventServiceUploadResponse {
}

service EventService {
  rpc Upload(EventServiceUploadRequest) returns (EventServiceUploadResponse) {
  }
}